services:
  - type: web
    name: aura-luxury-commerce
    runtime: python
    buildCommand: ./render-build.sh
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        value: pa-IRb8tYzm_bhrarUI5cRipZ_rgNUygFm2x62ohiCTQpr
      - key: MONGODB_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
